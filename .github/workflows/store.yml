name: microsoft-store
# Construit le MSIX d'une release stable et le soumet en certification sur le Microsoft Store
# (docs/microsoft-store.md). Appelé par quality-release après chaque release de main ;
# lançable à la main, en dry_run pour vérifier le paquet et l'accès à Partner Center sans rien soumettre.
# Authentification OIDC à l'application Entra « github-store-submission » : aucun secret.
on:
  workflow_call:
    inputs:
      tag: {type: string, required: true}
  workflow_dispatch:
    inputs:
      tag: {description: 'Tag de release stable (vX.Y.Z)', type: string, required: true}
      dry_run: {description: "Construire et vérifier l'accès sans soumettre", type: boolean, default: true}
permissions: {contents: read, id-token: write}
concurrency: {group: microsoft-store, cancel-in-progress: false}
jobs:
  submit:
    runs-on: windows-latest
    steps:
      - name: Version du tag
        id: version
        shell: pwsh
        env: {TAG: "${{ inputs.tag }}"}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag de release stable attendu (vX.Y.Z) : $env:TAG" }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # dry_run construit le commit du workflow (scripts à jour, même si le tag est antérieur à
        # scripts/package-msix.ps1) avec la version du tag ; une vraie soumission part du tag.
        with: {ref: "${{ inputs.dry_run && github.sha || inputs.tag }}"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - name: Paquet MSIX
        id: package
        shell: pwsh
        env: {VERSION: "${{ steps.version.outputs.version }}"}
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $msix = ./scripts/package-msix.ps1 -Version $env:VERSION
          "msix=$msix" >> $env:GITHUB_OUTPUT
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.STORE_CLIENT_ID }}
          tenant-id: ${{ vars.STORE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Soumission au Microsoft Store
        shell: pwsh
        env:
          DRY_RUN: "${{ inputs.dry_run }}"
          MSIX: "${{ steps.package.outputs.msix }}"
        run: |
          if ($env:DRY_RUN -eq 'true') { ./scripts/publish-store.ps1 -DryRun; exit }
          ./scripts/publish-store.ps1 -Msix $env:MSIX
