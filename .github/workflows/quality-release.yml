name: quality-release
# Stack-agnostic delivery pipeline generated by company-os/tools/bootstrap-code-project.py.
# Each check runs only when its stack is present, so the pipeline is green from day one
# and picks up Node/TypeScript, .NET, Python and OpenSpec as the first slices add them.
# Policy: no CI artifacts (no Playwright reports, traces or screenshots); semgrep always runs,
# and dependency-audit blocks the release on any known high/critical dependency vulnerability.
on:
  pull_request: {branches: [rc, main]}
  push: {branches: [rc, main]}
permissions: {contents: write, packages: write, pull-requests: write, issues: write}
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/default --error
  # Known vulnerabilities (CVE/GHSA) in dependencies: fails on high or critical.
  # Dev dependencies are included on purpose: electron and the bundled renderer code ship in the app.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('package-lock.json', 'pnpm-lock.yaml') != ''
        with: {node-version: 22}
      - name: Node
        if: hashFiles('package-lock.json', 'pnpm-lock.yaml') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable; pnpm audit --audit-level high; else npm audit --audit-level high; fi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: hashFiles('**/*.slnx', '**/*.sln') != ''
        with: {dotnet-version: '10.0.x'}
      - name: .NET
        if: hashFiles('**/*.slnx', '**/*.sln') != ''
        run: |
          solution=$(git ls-files '*.slnx' '*.sln' | head -1)
          dotnet restore "$solution"
          dotnet list "$solution" package --vulnerable --include-transitive | tee audit.txt
          ! grep -qE '\b(High|Critical)\b' audit.txt
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: hashFiles('pyproject.toml') != ''
      - name: Python
        if: hashFiles('pyproject.toml') != ''
        run: uv export --all-extras --no-hashes --no-emit-project | uvx pip-audit --strict -r /dev/stdin
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: OpenSpec
        if: hashFiles('openspec/**') != ''
        run: npx -y @fission-ai/openspec@1.4.1 validate --all --strict
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('package.json') != ''
        with: {node-version: 22}
      - name: Node / TypeScript
        if: hashFiles('package.json') != ''
        run: |
          corepack enable
          if [ -f pnpm-lock.yaml ]; then pm=pnpm; pnpm install --frozen-lockfile; else pm=npm; npm ci; fi
          for script in lint typecheck test build; do
            if node -e "process.exit(require('./package.json').scripts?.['$script'] ? 0 : 1)"; then "$pm" run "$script"; fi
          done
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: hashFiles('**/*.slnx', '**/*.sln') != ''
        with: {dotnet-version: '10.0.x'}
      - name: .NET
        if: hashFiles('**/*.slnx', '**/*.sln') != ''
        run: |
          solution=$(git ls-files '*.slnx' '*.sln' | head -1)
          dotnet format "$solution" --verify-no-changes
          dotnet test "$solution" -c Release
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: hashFiles('pyproject.toml') != ''
      - name: Python
        if: hashFiles('pyproject.toml') != ''
        run: |
          uv sync --all-extras --dev
          uvx ruff check .
          uv run pytest || [ $? -eq 5 ]
  release:
    needs: [semgrep, dependency-audit, quality]
    if: github.event_name == 'push'
    # Pinned: on the ubuntu26 image, Wine inside electronuserland/builder:wine fails
    # with "socket: Function not implemented" while building the NSIS installer.
    runs-on: ubuntu-24.04
    # id-token: OIDC federation with Azure for Artifact Signing (no stored secret).
    permissions: {contents: write, packages: write, pull-requests: write, issues: write, id-token: write}
    # Windows code signing (docs/adr/0004-windows-code-signing.md). Enabled as soon as the
    # repository variable WINDOWS_SIGNING_ENDPOINT exists; until then the installer stays unsigned.
    env:
      WINDOWS_SIGNING_KEYSTORE: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
      WINDOWS_SIGNING_ALIAS: ${{ vars.WINDOWS_SIGNING_ALIAS }}
      WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Azure login for Artifact Signing (OIDC)
        if: vars.WINDOWS_SIGNING_ENDPOINT != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Artifact Signing access token
        if: vars.WINDOWS_SIGNING_ENDPOINT != ''
        run: |
          token=$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)
          echo "::add-mask::$token"
          echo "WINDOWS_SIGNING_STOREPASS=$token" >> "$GITHUB_ENV"
      - name: Semantic release (rc = prerelease, main = stable)
        run: >-
          npx -y -p semantic-release@24 -p @semantic-release/changelog@6 -p @semantic-release/git@10
          -p @semantic-release/exec@6 semantic-release
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
